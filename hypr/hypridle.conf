general {
    lock_cmd = bash $HOME/.config/quickshell/bin/qs-system-lock

    before_sleep_cmd = bash $HOME/.config/quickshell/bin/qs-system-lock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    inhibit_sleep = 1
}

listener {
    timeout = 600
    on-timeout = bash $HOME/.config/quickshell/bin/qs-system-lock
}